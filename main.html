<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Portal Arcade</title>
    <style>
        /* CSS Variables for easy color changes */
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --card-bg: #1e1e1e;
            --accent-color: #00d2ff;
            --accent-hover: #3a7bd5;
        }

        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Header Styling */
        header {
            text-align: center;
            padding: 3rem 1rem;
            background: linear-gradient(135deg, #1e1e1e 0%, #000000 100%);
            border-bottom: 2px solid var(--accent-color);
        }

        header h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            color: var(--accent-color);
        }

        header p {
            font-size: 1.2rem;
            color: #aaaaaa;
        }

        /* Main Content & Grid Layout */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .game-grid {
            display: grid;
            /* Creates a responsive grid that fits as many 250px columns as possible */
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }

        /* Game Card Styling */
        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.2);
        }

        /* Placeholder for Game Images */
        .game-image {
            width: 100%;
            height: 180px;
            background-color: #2c2c2c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #555;
            border-bottom: 2px solid #333;
        }

        /* Card Content */
        .game-info {
            padding: 1.5rem;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-title {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .game-category {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Play Button */
        .play-btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(45deg, var(--accent-hover), var(--accent-color));
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.3s ease, transform 0.2s ease;
            border: none;
            width: 100%;
        }

        .game-card:hover .play-btn {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <header>
        <h1>Game Arcade</h1>
        <p>Select your next adventure</p>
    </header>

    <main>
        <div class="game-grid">
            
            <div class="game-card">
                <div class="game-image"><img src="chess\Satranch.png", height="180"></div>
                <div class="game-info">
                    <div>
                        <h2 class="game-title">Chess</h2>
                        <p class="game-category">Strategy</p>
                    </div>
                    <a href="chess\chessbase.html" class="play-btn">Play Now</a>
                </div>
            </div>

            <div class="game-card">
                <div class="game-image"><img src="snl\asset\logo.png", height="180"></div>
                <div class="game-info">
                    <div>
                        <h2 class="game-title">snake'N'ladders</h2>
                        <p class="game-category">fun</p>
                    </div>
                    <a href="snl\snakebase.html" class="play-btn">Play Now</a>
                </div>
            </div>

            <div class="game-card">
                <div class="game-image"><img src="ttt\ttt.png", height="180"></div>
                <div class="game-info">
                    <div>
                        <h2 class="game-title">Tic Tac Toe</h2>
                        <p class="game-category">Grid</p>
                    </div>
                    <a href="ttt\tttbase.html" class="play-btn">Play Now</a>
                </div>
            </div>
            <div class="game-card">
                <div class="game-image">🏎️</div>
                <div class="game-info">
                    <div>
                        <h2 class="game-title">Neon Racer</h2>
                        <p class="game-category">Racing</p>
                    </div>
                    <a href="#play-racer" class="play-btn">Play Now</a>
                </div>
            </div>

            <div class="game-card">
                <div class="game-image">🧩</div>
                <div class="game-info">
                    <div>
                        <h2 class="game-title">Brain Teaser</h2>
                        <p class="game-category">Puzzle</p>
                    </div>
                    <a href="#play-puzzle" class="play-btn">Play Now</a>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
